name: coffee_shop
description: A simple coffee shop management MVP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.5.0
  qr_flutter: ^4.1.0
  intl: ^0.18.1
  lottie: ^2.7.0
  image_picker: ^1.0.4
  shared_preferences: ^2.2.2
  http: ^1.1.0
  pdf: ^3.10.4
  printing: ^5.11.1
  audioplayers: ^5.2.1
  google_fonts: 6.1.0
  mobile_scanner: ^4.0.1

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/background.png
    - assets/images/table.png
    - assets/animations/loading.json
    - assets/sounds/new_order.mp3
    - assets/sounds/check.mp3